name: SUJAAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify database migrations on a fresh SQLite database
        env:
          APP_ENV: test
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          ADMIN_EMAIL: ci-owner@example.test
          ADMIN_PASSWORD: ci-only-password
          DATABASE_URL: sqlite:///./ci_migration.db
        run: alembic upgrade head
      - name: Run API tests
        env:
          APP_ENV: test
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          ADMIN_EMAIL: ci-owner@example.test
          ADMIN_PASSWORD: ci-only-password
          DATABASE_URL: sqlite:///./ci_sujaai.db
        run: pytest -q
      - name: Verify Vercel FastAPI entrypoint and API route registration
        env:
          APP_ENV: test
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          ADMIN_EMAIL: ci-owner@example.test
          ADMIN_PASSWORD: ci-only-password
          DATABASE_URL: sqlite:///./ci_root_entrypoint.db
          PYTHONPATH: backend
        working-directory: .
        run: python -c "import main; paths = main.app.openapi()['paths']; required = ['/api/health', '/api/auth/login', '/api/chit/groups']; missing = [path for path in required if path not in paths]; assert not missing, f'Missing API routes: {missing}'; print('Vercel FastAPI entrypoint and API routes OK')"

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
