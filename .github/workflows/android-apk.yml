name: Build SUJAAI Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms android --project-name sujaai_mobile .
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: sujaai-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
